services:
  postgres:
    image: postgres:latest
    container_name: covoit-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: CovoiturAfpa
      POSTGRES_TEMPLATE: template0
    ports:
      - "5432:5432" 
    volumes:
      - ./db/:/docker-entrypoint-initdb.d/
    networks:
      - db-reseau

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - db-reseau
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json

networks:
  db-reseau:
    driver: bridge
volumes:
  postgres_data:
  pgadmin_data: